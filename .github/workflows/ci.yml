name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm ci
      - run: npm run test-core
      - run: npm run test-golden
      - run: cargo test -p delve-storage
      - run: cargo test -p delve-wasm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:wasm
      - run: npm run test-ui
      - run: npm run test-license
      - run: npm run test-sbom
      - run: npm run build
      - run: npm run test-bundle
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push' && github.repository_visibility == 'public'
        with:
          subject-path: dist
