name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm ci
      - name: Linux desktop build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm run test-core
      - run: npm run test-golden
      - run: cargo test -p delve-planning -p delve-assurance -p delve-engine
      - run: cargo test -p delve-storage
      - run: cargo test -p delve-wasm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build:wasm
      - run: npm run verify:collision
      - run: npm run test-ui
      - run: npm run test-license
      - run: npm run test-sbom
      - run: npm run build
      - run: npm run test-bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculation-and-browser-evidence
          path: |
            artifacts/verification/
            test-results/
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push' && github.repository_visibility == 'public'
        with:
          subject-path: dist

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-evaluation-installer
          path: target/release/bundle/nsis/*.exe
